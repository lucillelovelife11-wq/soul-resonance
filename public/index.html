<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>心灵共感 · Soul Resonance</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="sigil">✦</div><h1>心灵共感</h1><p class="tagline">SOUL RESONANCE · 在彼此的故事里，发现新的理解</p></header><section id="entry" class="panel"><h2>开启一次共感之旅</h2><p>真实的感受，由你定义。塔罗只是对话的起点。</p><label>你的昵称<input id="name" maxlength="32" placeholder="例如：星河"></label><label>心灵洞察牌阵<select id="spread"></select></label><button id="create">创建房间</button><div class="separator">或加入朋友的房间</div><label>六位房间码<input id="code" maxlength="6" placeholder="ABC123"></label><button class="secondary" id="join">加入房间</button></section><section id="game" hidden><div class="panel"><div class="top"><div><small>房间代码</small><h2 id="roomcode"></h2></div><button class="secondary small" id="copy">复制邀请链接</button></div><p id="status"></p><div id="players" class="chips"></div><div id="lobby"><p>等待朋友加入，至少两人即可开始。你可以在另一台设备上打开邀请链接。</p><button id="start">开始共感</button></div></div><div id="round" hidden><div class="panel"><h2 id="roundTitle"></h2><p>每个人的牌面独立随机抽取。请只评价属于自己的问题。</p><div id="cards"></div><button id="next" hidden>进入下一轮</button></div></div><div id="end" class="panel" hidden><h2>✦ 关系洞察报告</h2><h3 id="resultName"></h3><p id="resultPersonal"></p><p id="model"></p><div id="resultCards"></div><h3>一起试试这些行动</h3><ul id="suggestions"></ul><p class="disclaimer">游戏仅用于自我探索与交流，不是心理诊断、占卜事实或治疗建议。</p></div></section><footer>随机抽牌 · 自由共感 · 尊重隐私</footer></main><div id="toast" role="status"></div><script src="/socket.io/socket.io.js"></script><script type="module" src="/app.js"></script></body></html>
